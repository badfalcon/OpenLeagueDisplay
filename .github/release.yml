# Categorization config for GitHub's "auto-generated release notes".
# When the release.yml workflow creates a Release with generate_release_notes: true,
# PRs merged since the previous tag are grouped and listed by these rules.
# (The weekly data.json auto-update is a direct push to main, not a PR, so it doesn't appear in the notes.)
changelog:
  exclude:
    # Exclude the data.json auto-update bot and PRs we don't want in the release
    authors:
      - github-actions
      - dependabot
    labels:
      - ignore-for-release
  categories:
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - documentation
    - title: 🔒 Security
      labels:
        - security
    # Catch-all for PRs that have none of the labels above ('*' is required)
    - title: 🔧 Other
      labels:
        - "*"
