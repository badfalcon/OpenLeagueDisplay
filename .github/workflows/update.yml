name: Update splash data

on:
  schedule:
    # 毎週月曜の朝9時(JST) = 日曜の0時(UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:   # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # === DEBUG MODE (一時) ===
      # universe-meeps の 403 切り分け中。data.json 生成はスキップして --probe
      # だけ走らせる。終わったらこのコミットを revert する。
      - name: PROBE (universe-meeps + CDragon)
        run: python generate_data.py --probe
