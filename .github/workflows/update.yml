name: Update splash data

on:
  schedule:
    # Every Monday 09:00 JST = Monday 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:   # Manual runs allowed too

permissions:
  contents: write
  issues: write   # To auto-file an @claude issue when a champion is missing from CHAMPION_REGIONS

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate data.json + i18n
        # Fetches per-champion JSON for 20 locales, so this takes ~10-30 min.
        # Well within the GitHub Actions job timeout (6h default).
        run: python generate_data.py

      - name: File @claude issue for unmapped champions
        # Runs only if generate_data.py wrote unmapped_regions.json.
        # If the file is absent, hashFiles returns '' and this step is skipped.
        # github-token uses the PAT (secrets.GH_PAT) when set, so the filed
        # issue fires claude.yml's issues.opened and proceeds to an auto PR.
        # Without a PAT it falls back to GITHUB_TOKEN: the issue is still
        # created but claude.yml does not fire, so it waits for a maintainer
        # to manually comment "@claude proceed".
        if: hashFiles('unmapped_regions.json') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const aliases = JSON.parse(fs.readFileSync('unmapped_regions.json', 'utf8'));

            // Skip filing if a same-titled issue is already open (matters since cron runs weekly)
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const titleOf = (a) => `CHAMPION_REGIONS: ${a} not registered`;
            const openTitles = new Set(openIssues.map(i => i.title));

            for (const alias of aliases) {
              if (openTitles.has(titleOf(alias))) {
                console.log(`Skip ${alias}: issue already open`);
                continue;
              }
              // CDragon alias is PascalCase. The wiki URL has the same form (PascalCase after stripping spaces)
              const wikiName = alias.charAt(0).toUpperCase() + alias.slice(1);
              const body = [
                `@claude New champion \`${alias}\` is not registered in \`CHAMPION_REGIONS\`.`,
                ``,
                `## What to do`,
                ``,
                `1. Look up the "Region" on https://wiki.leagueoflegends.com/en-us/${wikiName}`,
                `2. Insert \`"${alias}": ["<slug>"],\` into the \`CHAMPION_REGIONS\` dict in \`generate_data.py\`, in alphabetical order`,
                `   - Valid slugs are the \`REGION_NAMES\` keys at the top of the same file (demacia/noxus/ionia/piltover/zaun/bilgewater/bandle-city/freljord/shadow-isles/shurima/targon/ixtal/void/runeterra/camavor/icathia)`,
                `   - For characters deeply tied to multiple regions, use an array with the primary one first (e.g. \`["demacia", "shadow-isles"]\`)`,
                `   - For a brand-new region with no matching slug, also add one line each to \`REGION_NAMES\` (generate_data.py) and \`REGION_LABELS\` (js/i18n.js)`,
                `3. Create a branch and open a PR`,
                ``,
                `_Auto-generated by \`Update splash data\` workflow_`,
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titleOf(alias),
                body,
              });
              console.log(`Filed issue for ${alias}`);
            }

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json i18n/ champions/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to data.json, i18n/, champions/ or sitemap.xml"
          else
            git commit -m "chore: auto-update data.json + i18n"
            git push
          fi
