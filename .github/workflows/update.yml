name: Update splash data

on:
  schedule:
    # 毎週月曜の朝9時(JST) = 日曜の0時(UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:   # 手動実行も可

permissions:
  contents: write
  issues: write   # CHAMPION_REGIONS 未登録時に @claude 宛て issue を自動起票するため

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate data.json + i18n
        # 20 locale ぶんの per-champion JSON 取得が走るので 10〜30 分程度かかる。
        # GitHub Actions の job timeout (デフォ6時間) には十分収まる
        run: python generate_data.py

      - name: File @claude issue for unmapped champions
        # generate_data.py が unmapped_regions.json を書き出した場合のみ走る。
        # ファイルが無ければ hashFiles が '' を返してこの step は skip される。
        # github-token は PAT (secrets.GH_PAT) が設定されていればそれを使う = 起票した
        # issue が claude.yml の issues.opened を発火させて自動 PR まで進む。PAT 未設定
        # の場合は GITHUB_TOKEN にフォールバック → issue は立つが claude.yml は
        # 発火しないので、メンテナが手動で "@claude proceed" コメントするまで待機する
        if: hashFiles('unmapped_regions.json') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const aliases = JSON.parse(fs.readFileSync('unmapped_regions.json', 'utf8'));

            // 同名 issue が既に open なら重複起票しない (毎週 cron で走るので重要)
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const titleOf = (a) => `CHAMPION_REGIONS: ${a} 未登録`;
            const openTitles = new Set(openIssues.map(i => i.title));

            for (const alias of aliases) {
              if (openTitles.has(titleOf(alias))) {
                console.log(`Skip ${alias}: issue already open`);
                continue;
              }
              // CDragon alias は PascalCase。wiki URL は同形 (空白除去後の PascalCase)
              const wikiName = alias.charAt(0).toUpperCase() + alias.slice(1);
              const body = [
                `@claude 新チャンピオン \`${alias}\` が \`CHAMPION_REGIONS\` に未登録です。`,
                ``,
                `## やってほしいこと`,
                ``,
                `1. https://wiki.leagueoflegends.com/en-us/${wikiName} で「Region」を調べる`,
                `2. \`generate_data.py\` の \`CHAMPION_REGIONS\` dict に \`"${alias}": ["<slug>"],\` を alphabet 順で挿入`,
                `   - 使える slug は同ファイル冒頭の \`REGION_NAMES\` キー (demacia/noxus/ionia/piltover/zaun/bilgewater/bandle-city/freljord/shadow-isles/shurima/targon/ixtal/void/runeterra/camavor/icathia)`,
                `   - 複数地域に深く関わるキャラは primary 先頭の配列で (例: \`["demacia", "shadow-isles"]\`)`,
                `   - 該当 slug が無い完全新地域なら \`REGION_NAMES\` (generate_data.py) と \`REGION_LABELS\` (index.html) にも 1 行ずつ追加`,
                `3. branch を作って PR を出す`,
                ``,
                `_Auto-generated by \`Update splash data\` workflow_`,
              ].join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titleOf(alias),
                body,
              });
              console.log(`Filed issue for ${alias}`);
            }

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json i18n/
          if git diff --cached --quiet; then
            echo "No changes to data.json or i18n/"
          else
            # data.json が変わった週だけ sitemap の lastmod も今日に進めて、検索エンジンに
            # 「中身が更新された」と伝える。<lastmod> の日付1行だけ差し替える。
            today=$(date -u +%Y-%m-%d)
            sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${today}</lastmod>#" sitemap.xml
            git add sitemap.xml
            git commit -m "chore: auto-update data.json + i18n"
            git push
          fi
