name: Update splash data

on:
  schedule:
    # 毎週月曜の朝9時(JST) = 日曜の0時(UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:   # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate data.json + i18n
        # 20 locale ぶんの per-champion JSON 取得が走るので 10〜30 分程度かかる。
        # GitHub Actions の job timeout (デフォ6時間) には十分収まる
        run: python generate_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json i18n/
          if git diff --cached --quiet; then
            echo "No changes to data.json or i18n/"
          else
            git commit -m "chore: auto-update data.json + i18n"
            git push
          fi
