name: Claude

# `@claude <task>` を issue 本文 / issue コメント / PR レビューコメントに含めると、
# Anthropic 公式の Claude Code Action がリポジトリに対して動く。
# 主な用途は CHAMPION_REGIONS 未登録 issue の自動 PR 化 (update.yml が起票したものを
# Claude が拾って wiki を調べて PR を作る)。
#
# === 重要: GITHUB_TOKEN による issue 作成は他ワークフローを起動しない ===
# GitHub の仕様で「GITHUB_TOKEN が作った issue は他の workflow を発火しない」(無限
# ループ防止のため)。update.yml が auto-file した issue でこの claude.yml を発火
# させたい場合、update.yml 側の github-script で PAT を使う必要がある:
#   secrets.GH_PAT に Personal Access Token (repo scope) を入れて
#   update.yml の github-script step に github-token: ${{ secrets.GH_PAT }} を指定。
# PAT 無しの場合は、メンテナが issue にコメントで "@claude proceed" と書いて
# 手動キックする運用 (issue_comment 経由なら起動する)。
#
# author_association ガードで OWNER/MEMBER/COLLABORATOR のみ通すため、外部の見ず知らず
# のユーザが "@claude" と書いても API クレジットは消費されない。
# issues.opened は github-actions[bot] / 自分自身でフィルタする (issue.user.login 一致 or
# author_association)。

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write       # PR 作成用に branch を push する権限
  issues: write         # issue にコメントを返す
  pull-requests: write  # PR の作成・更新

jobs:
  claude:
    if: >
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        (
          github.event.issue.user.login == 'github-actions[bot]' ||
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
