name: Claude

# Including `@claude <task>` in an issue body / issue comment / PR review comment
# runs Anthropic's official Claude Code Action against the repo.
# The main use is turning unmapped-CHAMPION_REGIONS issues into auto PRs (Claude
# picks up the issue filed by update.yml, looks up the wiki, and opens a PR).
#
# === Important: issues created by GITHUB_TOKEN don't trigger other workflows ===
# Per GitHub's design, "an issue created by GITHUB_TOKEN does not fire other
# workflows" (to prevent infinite loops). To fire this claude.yml from an issue
# auto-filed by update.yml, update.yml's github-script must use a PAT:
#   put a Personal Access Token (repo scope) in secrets.GH_PAT and pass
#   github-token: ${{ secrets.GH_PAT }} to update.yml's github-script step.
# Without a PAT, the workflow is kicked manually by a maintainer commenting
# "@claude proceed" on the issue (via issue_comment it does fire).
#
# The author_association guard only lets OWNER/MEMBER/COLLABORATOR through, so an
# unknown outside user writing "@claude" doesn't consume API credits.
# issues.opened is filtered to github-actions[bot] / ourselves (issue.user.login
# match or author_association).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write       # Permission to push branches for PR creation
  issues: write         # Reply with comments on issues
  pull-requests: write  # Create/update PRs

jobs:
  claude:
    if: >
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        (
          github.event.issue.user.login == 'github-actions[bot]' ||
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
