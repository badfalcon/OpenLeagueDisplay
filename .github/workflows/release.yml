name: Build & release binaries

# On tag push (v*), build the local executable for each OS and attach it to the Release.
# Binaries are distributed as Release assets, not committed to the repo (no-binaries-in-repo).
# Independent of the weekly data.json update (update.yml).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # Manual runs allowed (for dry runs; a Release is only created on tag push)

permissions:
  contents: write   # Needed to create the Release / upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: OpenLeagueDisplay-windows.exe
            bin: dist/OpenLeagueDisplay.exe
          - os: macos-latest
            asset: OpenLeagueDisplay-macos
            bin: dist/OpenLeagueDisplay
          - os: ubuntu-latest
            asset: OpenLeagueDisplay-linux
            bin: dist/OpenLeagueDisplay
    runs-on: ${{ matrix.os }}
    # The Windows runner's default console is cp1252, so non-ASCII/Japanese log
    # output from generate_data.py or pyinstaller fails the job with
    # UnicodeEncodeError ('charmap' codec). Enable UTF-8 mode (PEP 540) to pin
    # stdout/stderr/open() defaults to UTF-8 (harmless on Linux/macOS, already UTF-8).
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # System libraries needed by pywebview's Linux backend (WebKitGTK).
      # Windows/macOS use the OS-bundled WebView2 / WKWebView, so no extra install is needed.
      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1

      - name: Install build deps
        run: pip install pyinstaller pywebview

      # Regenerate data.json / i18n before bundling (refresh the snapshot that gets bundled).
      # Don't use LOL_INSECURE in Actions.
      - name: Generate data.json + i18n
        run: python generate_data.py

      # The icon (icon.ico) is committed to the repo (generated/updated by make_icon.py).
      # local_app.spec embeds it into the exe on Windows, and installer/windows.iss
      # uses it for the installer / shortcuts. No generation step needed here.
      - name: Build with PyInstaller
        run: pyinstaller local_app.spec

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.bin }}" "out/${{ matrix.asset }}"

      # On Windows only, also build a proper installer (setup.exe) with Inno Setup.
      # Provides a "real software" experience with Start Menu entry, uninstaller
      # (Apps & features) and desktop shortcut.
      # Ship both this and the portable exe (the bare binary above) in the Release.
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # On tag push, take the version from the tag (v1.2.3 -> 1.2.3); on manual runs, "dev".
          $ver = "dev"
          if ($env:GITHUB_REF -like "refs/tags/*") { $ver = "$env:GITHUB_REF_NAME" -replace '^v','' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DAppVersion=$ver" installer\windows.iss
          if (-not (Test-Path installer\out\OpenLeagueDisplay-windows-setup.exe)) { throw "installer build failed" }

      # On tag push, upload to the Release. On manual runs (workflow_dispatch),
      # only upload to Artifacts (no Release is created).
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The Windows job also bundles setup.exe (on other OSes the glob is
          # just ignored).
          files: |
            out/${{ matrix.asset }}
            installer/out/OpenLeagueDisplay-windows-setup.exe
          # Let GitHub auto-aggregate PRs/commits since the previous tag into the
          # Release notes (categorization rules in .github/release.yml). Generated on
          # exactly ONE matrix leg: action-gh-release APPENDS generated notes to an
          # existing Release's body rather than overwriting, so all three legs doing it
          # tripled the changelog (bitten on v1.1.0, fixed by hand). Asset uploads are
          # unaffected — every leg still attaches its own binary to the same Release.
          generate_release_notes: ${{ runner.os == 'Windows' }}

      - name: Upload as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      # Make the Windows installer inspectable via Artifacts on dry runs (workflow_dispatch) too.
      - name: Upload installer as workflow artifact (Windows)
        if: ${{ runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenLeagueDisplay-windows-setup.exe
          path: installer/out/OpenLeagueDisplay-windows-setup.exe
