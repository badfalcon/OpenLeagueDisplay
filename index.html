<!DOCTYPE html>
<!-- i18n-loading: ES Modules behave like defer, so the hardcoded English in index.html
     flashes briefly before the saved locale's applyStaticUIStrings() runs. styles.css
     keeps the target elements visibility:hidden and init() removes it.
     As a failsafe for when JS fails entirely, it auto-clears after 3 seconds -->
<html lang="en" class="i18n-loading">
<head>
<script src="js/i18n-failsafe.js"></script>
<meta charset="utf-8">
<!-- Allow pinch-zoom (WCAG 1.4.4 Resize text). Do NOT add maximum-scale=1 / user-scalable=no:
     iOS ignores them anyway, but they disabled zoom on Android.
     Double-tap zoom is suppressed by touch-action: manipulation in styles.css -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Content Security Policy (defense-in-depth)
  ------------------------------------------
  All innerHTML interpolation is HTML-escaped via esc(), so there is no XSS sink, but this
  is a backstop against future regressions and to limit the blast radius of a CDN compromise.
  - script-src: 'self' covers js/*.js (ES Modules + i18n-failsafe.js classic script).
    Inline JS was fully removed, so no 'unsafe-inline' (image load/error is caught via
    capture delegation on #root, and the i18n-loading failsafe was moved out to
    js/i18n-failsafe.js). jsdelivr is for loading JSZip from CDN, static.cloudflareinsights.com
    is for Cloudflare Web Analytics' beacon.min.js
  - style-src: 'self' covers styles.css. 'unsafe-inline' is needed for Google Fonts and for
    inline style attributes inside innerHTML such as style="min-width:Nch"
  - img-src: data: is needed to render styles.css's inline SVG icons (search magnifier /
    select arrow / body::after noise). blob: is not added since none are generated.
    CDragon + flag CDN are allowed as external images
  - connect-src: ZIP creation fetches from raw.communitydragon.org, i18n/data.json are self,
    cloudflareinsights.com is the Web Analytics beacon destination
  - manifest-src: the PWA manifest.webmanifest is same-origin
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://raw.communitydragon.org https://flagcdn.com; connect-src 'self' https://raw.communitydragon.org https://cloudflareinsights.com; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<meta name="description" content="OpenLeagueDisplay — A splash viewer for every League of Legends champion and skin. Pick favorites, download as ZIP, set as wallpaper.">
<!-- OGP / Twitter Card: og:image / twitter:image use absolute URLs because crawlers
     can't resolve relative ones. ogp.png is 1200x630 (the 1.91:1 ratio recommended for
     twitter:card summary_large_image), a static asset at the repo root.
     When swapping it, update og:image:width/height to match -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://badfalcon.github.io/OpenLeagueDisplay/">
<meta property="og:title" content="OpenLeagueDisplay">
<meta property="og:description" content="Static splash viewer aiming to replace LeagueDisplays. Download by champion / skin line / selection as ZIP.">
<meta property="og:image" content="https://badfalcon.github.io/OpenLeagueDisplay/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="OpenLeagueDisplay — splash viewer for every League of Legends champion and skin">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OpenLeagueDisplay">
<meta name="twitter:description" content="Static splash viewer aiming to replace LeagueDisplays">
<meta name="twitter:image" content="https://badfalcon.github.io/OpenLeagueDisplay/ogp.png">
<title>OpenLeagueDisplay</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- PWA: for add-to-home-screen / install. Icons are SVG (keeping the no-binaries-in-repo
     policy). theme-color matches the site's --bg.
     apple-* meta are for iOS standalone display and the translucent status bar -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07060b">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenLeague">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.communitydragon.org">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- JSZip: lazy-loaded to build ZIPs entirely in the browser. The viewer itself works even
     if the CDN is down. integrity (SRI) prevents arbitrary JS execution if jsdelivr is
     compromised. When bumping the version, regenerate the hash (e.g. via https://www.srihash.org/) -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
        integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
        crossorigin="anonymous" defer></script>
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<!-- Skip link: lets keyboard users jump straight to the content (champion grid) without
     tabbing through the two-row header (title / ? / language / tabs / action buttons). Normally
     hidden off-screen, shown at top-left only on focus. applyStaticUIStrings() keeps the text in sync with the locale -->
<a href="#root" class="skip-link" id="skip-link">Skip to content</a>

<!-- topbar: a two-row sticky bar.
     Row 1 (.header-primary):   brand (logo + count) … ? + language picker (.header-utils)
     Row 2 (.header-secondary): view-tabs … My Gallery / Slideshow (.header-actions)
     Rows are split by role: row 1 holds identity + persistent utilities, row 2 holds browsing controls.
     The search bar / back button / sort live in the dom-stash below and are transplanted
     into the .champ-header-controls slot by render() -->
<div class="topbar">
  <header>
    <div class="header-primary">
      <div class="header-brand">
        <div class="header-brand-info">
          <!-- Logo = return to home. Keep the h1 heading semantics while making the click
               action keyboard-accessible by wrapping a <button> inside (transparent + inherited font, so it looks unchanged) -->
          <h1><button id="title" type="button">OpenLeagueDisplay</button></h1>
          <span id="stats"></span>
        </div>
      </div>
      <div class="header-utils">
        <button class="btn btn-icon" id="help-btn" type="button" aria-label="Open guide">?</button>
        <!-- Share: devices with the Web Share API (mostly mobile) get the native share sheet;
             others copy the site URL to the clipboard. The icon is inline SVG to avoid adding
             external assets (no-binaries-in-repo policy) -->
        <button class="btn btn-icon" id="share-btn" type="button" aria-label="Share this site">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line>
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
          </svg>
        </button>
        <div class="lang-picker" id="lang-picker">
          <!-- This is a disclosure (open/close toggle), so no aria-haspopup (aria-haspopup="true"
               implies "menu", which mismatches an implementation that has no arrow-key menu model).
               aria-expanded alone conveys the open/closed state -->
          <button class="btn" id="lang-btn" type="button" aria-expanded="false" aria-label="Display language">
            <img class="lang-flag" id="lang-flag" alt="" decoding="async">
          </button>
          <!-- Collapsible language menu (disclosure). Originally role="listbox" + role="option",
               but interposing <li> breaks the listbox→option ownership, and making each option a
               Tab-focusable <button> also mismatched the listbox pattern (arrow keys / activedescendant).
               Switched to a plain list to match reality (button opens it, items are buttons), and
               the current language is marked with aria-current. Keyboard still works via Tab/Enter/Esc -->
          <ul class="lang-menu" id="lang-menu" hidden></ul>
        </div>
      </div>
    </div>
    <div class="header-secondary">
      <!-- View-switch nav. role="tab" is only valid together with a tabpanel / arrow-key
           operation, so here we match reality (client-side navigation) and convey the current
           location with aria-current="page" (toggled by render()) -->
      <div class="view-tabs">
        <button class="tab" id="tab-home" type="button">Champions</button>
        <button class="tab" id="nav-lines" type="button">Skin Lines</button>
      </div>
      <div class="header-actions">
        <button class="btn" id="gallery-btn">My Gallery</button>
        <button class="btn" id="slideshow-btn">Slideshow</button>
      </div>
    </div>
  </header>
</div>

<!-- DOM stash: the "home" for the search bar / back button / sort selector. They are parked
     here, then transplanted into the .champ-header-controls slot after innerHTML is regenerated
     in render(). Hidden via the hidden attribute -->
<div class="dom-stash" id="dom-stash" hidden>
  <button class="btn" id="back-btn">← Back</button>
  <input type="search" id="search" placeholder="Search champion…">
  <label class="sort-label" id="sort-label" for="sort-select">Sort order</label>
  <select class="ctrl-select" id="sort-select">
    <option value="name_asc">Name A → Z</option>
    <option value="name_desc">Name Z → A</option>
    <option value="release">Release date</option>
  </select>
</div>

<!-- tabindex="-1" lets this be the skip link's landing target (programmatic focus) -->
<main id="root" tabindex="-1">
  <div class="loading"><h2 id="loading-title">LOADING</h2><p id="loading-msg">Loading manifest…</p></div>
</main>

<div class="progress-overlay" id="progress-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="progress-box">
    <h3 id="prog-title">Creating ZIP</h3>
    <div class="desc" id="prog-desc">Fetching images from CDragon…</div>
    <div class="progress-bar"><div class="fill" id="prog-fill" style="width:0%"></div></div>
    <div class="progress-stats">
      <span id="prog-count">0 / 0</span>
      <span id="prog-fail"></span>
    </div>
    <div class="progress-actions">
      <button class="btn" id="prog-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- aria-labelledby names the dialog after the displayed skin (lb-champ = champion name /
     lb-skin = skin name). openLightbox fills both via updateMeta() right after showing, before
     moving focus, so a screen reader reads "<champion> <skin>, dialog" -->
<!-- inert while closed (default): hiding it only with opacity/pointer-events for the fade would
     leave the hidden controls (close / prev-next / fit etc.) in the tab order and reachable by SR
     (other overlays vanish with display:none, but the lightbox stays because it fades).
     openLightbox removes inert and closeLightbox re-adds it -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-champ lb-skin" aria-hidden="true" inert>
  <div class="lb-stage">
    <img class="lb-img" id="lb-img-a" alt="">
    <img class="lb-img" id="lb-img-b" alt="">
    <!-- For animated splashes (skins with splashVideoPath).
         muted + playsinline get around the autoplay policy, loop keeps it playing across the interval.
         The poster shows the static splash image to bridge until the video finishes loading -->
    <video class="lb-video" id="lb-video" muted loop playsinline preload="auto"></video>
  </div>
  <!-- Controls are consolidated into a single top bar. counter on the left, control buttons
       (pause / fit / ⚙ / close) on the right with close at the far right. The spacer pushes
       the two sides apart. Only the nav arrows ‹ › stay large and vertically centered on each side, prioritizing tap target size -->
  <div class="lb-toolbar">
    <span class="badge" id="lb-counter"></span>
    <span class="lb-toolbar-spacer"></span>
    <!-- Pause: shown only during the slideshow, JS toggles display -->
    <button class="ss-btn" id="ss-pause" style="display:none">⏸ Pause</button>
    <!-- Image fit toggle: contain (whole image) ↔ cover (fill screen). Kills the letterboxing
         of 16:9 splashes on tall phones. State is shown via the icon and the aria-label is fixed.
         Always visible since it applies in both viewer and slideshow modes -->
    <button class="ss-btn lb-icon" id="lb-fit" aria-label="Toggle image fit">⛶</button>
    <!-- Interval and caption are "set once and leave it" settings, so they're consolidated into
         the ⚙ menu. JS shows the whole wrap only during the slideshow -->
    <div class="ss-options-wrap" id="ss-options-wrap" style="display:none">
      <!-- Like the language menu, this is a disclosure (interval/caption toggle group), so no
           aria-haspopup; aria-expanded alone conveys open/closed -->
      <button class="ss-btn ss-gear lb-icon" id="ss-options" aria-expanded="false" aria-label="Slideshow settings">⚙</button>
      <div class="ss-menu" id="ss-menu" hidden>
        <button class="ss-btn" id="ss-interval">⏱ 7s</button>
        <button class="ss-btn" id="ss-caption">💬 Full</button>
      </div>
    </div>
    <button class="ss-btn lb-icon" id="lb-close" aria-label="Close">✕</button>
  </div>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <button class="lb-nav lb-next" id="lb-next" aria-label="Next">›</button>
  <div class="lb-overlay">
    <div class="lb-champ" id="lb-champ"></div>
    <div class="lb-skin" id="lb-skin"></div>
    <!-- Skin description (lore/flavor). Few skins have a description, but the area (min-height)
         is reserved even when absent so the skin name's height doesn't shift depending on whether
         a description exists (it doesn't collapse). JS fills in the text -->
    <div class="lb-desc" id="lb-desc"></div>
  </div>
</div>

<!-- tutorial overlay: auto-shown on first visit / reopened via the header ? button and ? key.
     tutorial.js injects the body from the i18n table via innerHTML (trusted strings only) -->
<div class="tutorial-overlay" id="tutorial-overlay" role="dialog" aria-modal="true" aria-labelledby="tut-title" aria-hidden="true">
  <div class="tutorial-box">
    <div class="tut-step-counter" id="tut-step-counter"></div>
    <h2 class="tut-title" id="tut-title"></h2>
    <div class="tut-body" id="tut-body"></div>
    <div class="tut-dots" id="tut-dots" aria-hidden="true"></div>
    <div class="tut-actions">
      <button class="btn" id="tut-skip" type="button">Skip</button>
      <div class="tut-nav">
        <button class="btn" id="tut-back" type="button">Back</button>
        <button class="btn primary" id="tut-next" type="button">Next</button>
      </div>
    </div>
  </div>
</div>

<!-- Offline-detection banner: opened/closed via navigator.onLine and online/offline events.
     CDragon splash images aren't cached, so they won't appear while offline. State the reason
     explicitly so it doesn't look "broken".
     applyStaticUIStrings() fills the text from the i18n table -->
<div class="offline-banner" id="offline-banner" role="status" aria-live="polite" hidden>
  <span id="offline-banner-text">You are offline — splash images may not load.</span>
</div>

<!-- "Back to top" FAB: a quick way back to the top when a long list (all champions / skin lines)
     is scrolled down. The glyph (↑) needs no i18n, but applyStaticUIStrings() keeps the aria-label
     in sync with the locale. Initially hidden; app.js shows it past a scrollY threshold -->
<button class="to-top" id="to-top" aria-label="Back to top" hidden>↑</button>

<!-- In-app "Back" FAB: the real ← Back button lives in the scrolling champ-header (not the sticky
     topbar), so on tall screens it scrolls out of reach and you'd otherwise have to scroll all the
     way up to go back. This bottom-left FAB mirrors it — app.js shows it once the real button has
     scrolled behind the topbar, and only in views where Back applies (detail views / while
     searching). The glyph (←) needs no i18n; applyStaticUIStrings() keeps the aria-label localized -->
<button class="to-back" id="to-back" aria-label="Back" hidden>←</button>

<!-- Status announcements for screen readers. Sighted users see the share button's icon turn
     into a checkmark, but rewriting aria-label alone isn't announced, so copy-complete is
     reported by updating this live region's text -->
<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>

<footer>
  <div class="footer-inner">
    <div class="footer-attribution">
      Images & data from <a href="https://communitydragon.org" target="_blank" rel="noopener">Community Dragon</a>
      · League of Legends © Riot Games, Inc.
      · <span id="patch-info"></span>
    </div>
    <div class="footer-credits">
      by <a href="https://github.com/badfalcon" target="_blank" rel="noopener">@badfalcon</a>
      · <a href="https://github.com/badfalcon/OpenLeagueDisplay" target="_blank" rel="noopener">Source</a>
      · <a href="https://github.com/badfalcon/OpenLeagueDisplay/blob/HEAD/LICENSE" target="_blank" rel="noopener">MIT License</a>
    </div>
    <!-- Legal disclaimer: Riot's "Legal Jibber Jabber" policy requires explicitly stating this is
         not endorsed by Riot. applyStaticUIStrings() fills the text from the i18n table -->
    <p class="footer-disclaimer" id="footer-disclaimer"></p>
  </div>
</footer>

<!-- Cloudflare Web Analytics: cookieless / privacy-conscious lightweight analytics.
     Just one deferred load of beacon.min.js. An analytics-only external dependency, separate
     from the feature library (JSZip); the viewer itself works even if the CDN is down.
     The beacon is sent to cloudflareinsights.com (allowed by the CSP connect-src).
     sw.js only intercepts same-origin requests, so this one passes through.
     The data-cf-beacon token is the value issued when registering the site in the Cloudflare dashboard. -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "3b9c447cd38d42a48d7bc318ffedd059"}'></script>

</body>
</html>
