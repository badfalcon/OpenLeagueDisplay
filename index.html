// navigator.languages から、CDragon の locale コード (xx_xx) に最も近いものを 1 つ拾う。
// 一致が無ければ "default" (= 英語) を返す
function pickInitialLocale(available) {
  const saved = lsGet(LS_LOCALE_KEY);
  if (saved && (saved === "default" || available.has(saved))) return saved;
  const langs = navigator.languages || [navigator.language || ""];
  for (const raw of langs) {
    if (!raw) continue;
    const norm = raw.toLowerCase().replace("-", "_");
    if (norm.startsWith("en")) return "default";
    if (available.has(norm)) return norm;
    // ブラウザは "ja" や "zh-Hant-TW" のような形で来ることもあるので、
    // 先頭の言語コード部分だけ取って prefix マッチを試す (zh → zh_cn/zh_tw のどれか)
    const short = norm.split("_")[0];
    for (const av of available) {
      if (av.startsWith(short + "_")) return av;
    }
  }
  return "default";
}

async function loadLocale(code) {
  if (code === "default") {
    state.locale = "default";
    state.i18n = { champions: {}, skins: {}, lines: {} };
    return;
  }
  try {
    const res = await fetch(`./i18n/${code}.json`, { cache: "force-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    state.locale = code;
    state.i18n = {
      champions: json.champions || {},
      skins: json.skins || {},
      lines: json.lines || {},
    };
  } catch (e) {
    // i18n ファイルが無い/壊れている時は静かに英語にフォールバック。UI は動く
    console.warn(`i18n: ${code} の読み込み失敗、英語にフォールバック`, e);
    state.locale = "default";
    state.i18n = { champions: {}, skins: {}, lines: {} };
  }
}

function saveSelected() {
  lsSet(LS_SELECTED_KEY, JSON.stringify([...state.selected]));
}
function loadSelectedFromStorage() {
  const raw = lsGet(LS_SELECTED_KEY);
  if (!raw) return [];
  try {
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.filter(x => typeof x === "string") : [];
  } catch (_) {
    return [];
  }
}

async function init() {
  // data.json 取得前でも localStorage の保存 locale で UI を仮表示しておく。
  // pickInitialLocale は data.json の locales を使うのでロード後に再呼び出しするが、
  // localStorage に保存があればそれを先に当てて初回フラッシュを減らす。
  const savedLoc = lsGet(LS_LOCALE_KEY);
  if (savedLoc && UI_STRINGS[savedLoc]) state.locale = savedLoc;
  // 並び順も再訪時に復元。未知の値が来てたら無視して default のまま
  const savedSort = lsGet(LS_SORT_KEY);
  if (savedSort === "default" || savedSort === "name_asc" || savedSort === "name_desc") {
    state.sortOrder = savedSort;
  }
  applyStaticUIStrings();
  // Cinzel フォントは defer 読込なので、初回の equalizeTabs() はフォールバック
  // フォントで測ってしまう。ready 後にもう一度合わせて崩れを防ぐ。
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(equalizeTabs);
  }
  try {
    const res = await fetch("./data.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch (e) {
    // data.json 未生成 (初回ローカル起動の典型エラー) は手順を案内する
    const is404 = /HTTP 404/.test(e.message);
    const hint = is404
      ? `<p style="margin-top:18px;font-size:13px;color:var(--ink-soft);line-height:1.7">${t("hint_no_data")}</p>`
      : "";
    $("root").innerHTML = `<div class="loading"><h2>${t("error_title")}</h2><p>${t("error_load_data", esc(e.message))}</p>${hint}</div>`;
    return;
  }

  // 言語ピッカーを構築 (data.json に同梱されている locales を使う)。古い data.json
  // (locales 未定義) でも壊れないよう、空の場合は "default" だけ表示する
  const localesMeta = Array.isArray(DATA.locales) && DATA.locales.length
    ? DATA.locales
    : [{ code: "default", label: "English" }];
  const menu = $("lang-menu");
  menu.innerHTML = localesMeta
    .map(l => {
      const url = localeFlagURL(l.code);
      const flag = url
        ? `<img class="lang-flag" src="${esc(url)}" alt="" loading="lazy" decoding="async">`
        : `<span class="lang-flag" aria-hidden="true"></span>`;
      return `<li><button type="button" role="option" data-code="${esc(l.code)}">`
        + flag
        + `<span>${esc(l.label)}</span></button></li>`;
    })
    .join("");
  const availableSet = new Set(localesMeta.map(l => l.code).filter(c => c !== "default"));
  const initial = pickInitialLocale(availableSet);
  setLangButton(initial);
  if (initial !== "default") {
    await loadLocale(initial);
    // ロード失敗時は loadLocale 内で "default" に戻されているので、UI も合わせる
    if (state.locale === "default") setLangButton("default");
  }
  // data.json 取得後に最終的な locale が確定したので、改めて static UI を反映
  // (stats/last_updated を含むため、必ず DATA セット後に呼ぶこと)
  applyStaticUIStrings();

  buildIndexes();

  // 前回セッションで選択していたスキンを復元する。data.json から消えた
  // (リネーム/削除された) キーは静かにフィルタしてストレージも上書き保存する
  const saved = loadSelectedFromStorage();
  if (saved.length) {
    for (const k of saved) {
      if (SKIN_BY_KEY.has(k)) state.selected.add(k);
    }
    if (state.selected.size !== saved.length) saveSelected();
    // 永続化が見えないと不気味なので、選択が残っていれば選択モードも自動で
    // 復元する (パックバーは selectMode が ON のときだけ出る仕様のため)
    if (state.selected.size > 0) {
      state.selectMode = true;
      document.body.classList.add("select-mode");
      const tgl = $("select-toggle");
      tgl.classList.add("primary");
      tgl.textContent = t("select_mode_on");
    }
  }

  render();
}

function render() {
  const root = $("root");
  // タブはトップレベル切替。back-btn は詳細 (champion / line) に居る時だけ表示。
  // ライン/ホーム同士の往復はタブ自身でやる。
  // 詳細ビューではタブと back が同じ「一覧へ戻る」アクションを意味するので、
  // タブを隠して back で置き換える (両者は同じ grid スロットを共有)
  const isLines = (state.view === "lines" || state.view === "line");
  const isDetail = (state.view === "champion" || state.view === "line");
  // 検索中も「一覧へ戻る」アクションを兼ねるので、タブを back に置き換える。
  // 詳細ビューと同じ挙動 (同 grid スロットを共有)
  const hasSearch = !!state.searchQuery;
  const showBack = isDetail || hasSearch;
  $("tab-home").classList.toggle("active", !isLines);
  $("nav-lines").classList.toggle("active", isLines);
  document.querySelector(".view-tabs").style.display = showBack ? "none" : "";
  $("back-btn").style.display = showBack ? "" : "none";
  // 並び順セレクタは home (チャンピオン一覧) ヘッダ右端に居る。innerHTML を
  // 書き換える前に保管庫 (#grid-toolbar) に退避しておかないと event listener ごと
  // 消える。home 以外では保管庫が display:none なので select も自動的に隠れる
  const sortSel = $("sort-select");
  if (sortSel && sortSel.parentNode !== $("grid-toolbar")) {
    $("grid-toolbar").appendChild(sortSel);
  }
  if (state.view === "home") renderHome(root);
  else if (state.view === "champion") renderChampion(root);
  else if (state.view === "lines") renderLines(root);
  else if (state.view === "line") renderLine(root);
  // home の Champions ヘッダにスロットを描いた後、退避してあった select を transplant
  if (state.view === "home" && sortSel) {
    const slot = root.querySelector(".champ-header-controls");
    if (slot) slot.appendChild(sortSel);
  }
  renderPackBar();
}

function renderHome(root) {
  const q = state.searchQuery.toLowerCase();
  // 検索キーワードは複数軸を OR で AND しない、つまり「どの軸でもヒットすれば残す」。
  // 軸 (チャンピオン側): チャンピオン名 (alias/英語名/翻訳名)、ロール (Mage 等)、
  // 地域 (Demacia 等)。軸 (スキン側): スキン名 (英語/翻訳)、rarity (Legendary 等)。
  // role/region/rarity の翻訳は英語キーと並べてチェックするので、ユーザがどちらの
  // 言語で打っても拾える。検索中は「該当チャンピオン」「該当スキン」を別セクション
  // にして縦に並べる: 例えば "garen" で打てば Garen 本人と他チャンプの Garen 風
  // スキン (もしあれば) を区別できる
  const localeRoles = ROLE_LABELS[state.locale] || {};
  const localeRarities = RARITY_LABELS[state.locale] || {};
  const localeRegions = REGION_LABELS[state.locale] || {};
  const hit = (s) => typeof s === "string" && s.toLowerCase().includes(q);

  // 並び替え: "default" は data.json の順 (リリース順) をそのまま使うので何もしない。
  // 名前順は localized name で localeCompare。比較に Intl 経路を使うため、
  // 日本語/韓国語/中文 でもクライアントの自然な並びになる
  const cmpLocale = state.locale === "default" ? "en" : state.locale.replace("_", "-");
  const sortSign = state.sortOrder === "name_asc" ? 1 : state.sortOrder === "name_desc" ? -1 : 0;
  const sortChamps = (arr) => sortSign && arr.sort((a, b) =>
    sortSign * champName(a).localeCompare(champName(b), cmpLocale, { sensitivity: "base" }));
  const sortSkins = (arr) => sortSign && arr.sort((a, b) => {
    const an = `${champName(a.c)} ${skinLabel(a.c, a.s)}`;
    const bn = `${champName(b.c)} ${skinLabel(b.c, b.s)}`;
    return sortSign * an.localeCompare(bn, cmpLocale, { sensitivity: "base" });
  });

  // 検索なし: 従来通りチャンピオン一覧だけ
  if (!q) {
    const list = DATA.champions.slice();
    sortChamps(list);
    root.innerHTML = `
      <div class="champ-header is-list">
        <h2>${t("nav_home")}</h2>
        <div class="champ-header-controls"></div>
        <span class="count">${t("champs_count", list.length)}</span>
      </div>
      <div class="champ-grid">${renderChampCards(list)}</div>`;
    wireChampCards(root);
    return;
  }

  // 検索あり: チャンピオン側ヒットとスキン側ヒットを別々に集める
  const champMatches = DATA.champions.filter(c => {
    if (hit(c.name) || hit(c.alias) || hit(champName(c))) return true;
    if ((c.roles || []).some(r => hit(r) || hit(localeRoles[r]) || hit(ROLE_LABELS.default[r]))) return true;
    if ((c.regions || []).some(slug => hit(slug) || hit(localeRegions[slug]) || hit(REGION_LABELS.default[slug]))) return true;
    return false;
  });
  const skinMatches = [];
  for (const c of DATA.champions) {
    for (const s of c.skins) {
      if (!s.splash) continue;
      const labelHit = hit(s.label) || hit(skinLabel(c, s));
      const rarityHit = s.rarity && (hit(s.rarity) || hit(localeRarities[s.rarity]) || hit(RARITY_LABELS.default[s.rarity]));
      if (labelHit || rarityHit) skinMatches.push({ c, s });
    }
  }
  sortChamps(champMatches);
  sortSkins(skinMatches);

  if (champMatches.length === 0 && skinMatches.length === 0) {
    root.innerHTML = `<div class="loading"><h2>${t("no_results_title")}</h2><p>${t("no_results_msg", esc(state.searchQuery))}</p></div>`;
    return;
  }

  const parts = [];
  if (champMatches.length > 0) {
    parts.push(`
      <div class="champ-header is-list">
        <h2>${t("nav_home")}</h2>
        <div class="champ-header-controls"></div>
        <span class="count">${t("champs_count", champMatches.length)}</span>
      </div>
      <div class="champ-grid">${renderChampCards(champMatches)}</div>`);
  }
  if (skinMatches.length > 0) {
    // 並び順スロットは原則 Champions ヘッダ側に置くが、検索ヒットが skin だけだった
    // 場合は Champions ヘッダ自体が描かれないので、その時だけ Skins 側を受け皿にする
    const ctrlSlot = champMatches.length === 0 ? `<div class="champ-header-controls"></div>` : "";
    parts.push(`
      <div class="champ-header is-list">
        <h2>${t("section_skins")}</h2>
        ${ctrlSlot}
        <span class="count">${t("skins_count", skinMatches.length)}</span>
      </div>
      <div class="skin-grid is-flat">${renderSkinCards(skinMatches)}</div>`);
  }
  root.innerHTML = parts.join("");
  wireChampCards(root);
  wireSearchSkinCards(root, skinMatches);
}

function renderChampCards(list) {
  return list.map(c => {
    // 選択モード中のみ、配下スキンの選択件数を集計して partial/selected を分ける。
    // state.selected は per-skin なので、ここは派生情報の計算でしかない (集合の真実は Set 側)
    let cls = "", cbText = "";
    if (state.selectMode && c.skins.length > 0) {
      const sel = c.skins.reduce((n, s) => n + (state.selected.has(SELECT_KEY(c.alias, s.label)) ? 1 : 0), 0);
      if (sel === c.skins.length) cls = " selected";
      else if (sel > 0) { cls = " partial"; cbText = `${sel}/${c.skins.length}`; }
    }
    return `
    <div class="champ-card${cls}" data-alias="${esc(c.alias)}">
      <div class="sel-checkbox">${esc(cbText)}</div>
      <img loading="lazy" src="${esc(c.portrait)}" alt="${esc(champName(c))}" onload="imgLoaded(this)" onerror="imgErr(this)">
      <div class="label">${esc(champName(c))}</div>
    </div>`;
  }).join("");
}

function renderSkinCards(matches) {
  return matches.map((m, i) => {
    const { c, s } = m;
    const k = SELECT_KEY(c.alias, s.label);
    const sel = state.selected.has(k) ? " selected" : "";
    const cn = champName(c);
    const sl = skinLabel(c, s);
    return `
    <div class="skin-card${sel}" data-idx="${i}" data-key="${esc(k)}" data-alias="${esc(c.alias)}">
      <div class="sel-checkbox"></div>
      <img loading="lazy" src="${esc(s.splash)}" alt="${esc(sl)}" onload="imgLoaded(this)" onerror="imgErr(this)">
      <div class="label">${esc(cn)} — ${esc(sl)}</div>
    </div>`;
  }).join("");
}

function wireChampCards(root) {
  root.querySelectorAll(".champ-card").forEach(el => {
    // 本体クリックは選択モードでも詳細画面へ。個別スキンの細かい調整は詳細でやる
    el.addEventListener("click", () => openChampion(el.dataset.alias));
    // □ クリックは「このチャンプの全スキンを一括 toggle」のショートカット
    const cb = el.querySelector(".sel-checkbox");
    if (cb) {
      cb.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!state.selectMode) return;
        bulkToggleChamp(el.dataset.alias);
      });
    }
  });
}

// 検索結果のスキンタイル: クリックでライトボックスを開く (lines view と同じ流儀)。
// 選択モード時は当該スキンだけを toggle (チャンピオン一括ではなく per-skin)
function wireSearchSkinCards(root, matches) {
  const lbList = matches.map(({ c, s }) => ({ champ: champName(c), skin: skinLabel(c, s), src: s.splash }));
  root.querySelectorAll(".skin-grid.is-flat .skin-card").forEach(el => {
    el.addEventListener("click", () => {
      const idx = parseInt(el.dataset.idx, 10);
      if (state.selectMode) { toggleSelected(el.dataset.key, el); return; }
      openLightbox(lbList, idx, "manual");
    });
  });
}

function renderChampion(root) {
  const c = DATA.champions.find(x => x.alias === state.currentChamp);
  if (!c) { state.view = "home"; render(); return; }
  const cards = c.skins.map((s, i) => {
    const k = SELECT_KEY(c.alias, s.label);
    const sel = state.selected.has(k) ? " selected" : "";
    const lab = skinLabel(c, s);
    return `
    <div class="skin-card${sel}" data-idx="${i}" data-key="${esc(k)}">
      <div class="sel-checkbox"></div>
      <img loading="lazy" src="${esc(s.splash)}" alt="${esc(lab)}" onload="imgLoaded(this)" onerror="imgErr(this)">
      <div class="label">${esc(lab)}</div>
    </div>`;
  }).join("");
  root.innerHTML = `
    <div class="champ-header">
      <h2>${esc(champName(c))}</h2>
      <span class="count">${t("skins_count", c.skins.length)}</span>
      <button class="btn primary" id="dl-champ">${t("dl_champion")}</button>
    </div>
    <div class="skin-grid">${cards}</div>`;
  root.querySelectorAll(".skin-card").forEach(el => {
    el.addEventListener("click", () => {
      const idx = parseInt(el.dataset.idx, 10);
      if (state.selectMode) { toggleSelected(el.dataset.key, el); return; }
      openLightbox(buildChampList(c), idx, "manual");
    });
  });
  $("dl-champ").addEventListener("click", () => downloadChampion(c));
}

function renderLines(root) {
  const lines = DATA.skin_lines || {};
  // 選択モード時は per-line の選択件数を集計 (state.selected は変化するので毎回計算)。
  // count/thumb は LINE_INDEX から取るので 1 回構築済み。
  const selectedCounts = {};
  if (state.selectMode && state.selected.size > 0) {
    for (const k of state.selected) {
      const hit = SKIN_BY_KEY.get(k);
      if (!hit) continue;
      for (const lid of (hit.s.lines || [])) {
        const id = String(lid);
        selectedCounts[id] = (selectedCounts[id] || 0) + 1;
      }
    }
  }
  const q = state.searchQuery.toLowerCase();
  // 表示は翻訳名、検索は (翻訳名 + 英語名) でマッチさせる
  const entries = Object.entries(lines)
    .map(([id, name]) => {
      const idx = LINE_INDEX.get(id);
      return { id, name: lineName(id), _en: name, count: idx ? idx.count : 0, thumb: idx ? idx.thumb : "" };
    })
    .filter(e => e.count > 0)
    .filter(e => !q || e.name.toLowerCase().includes(q) || e._en.toLowerCase().includes(q))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  if (entries.length === 0) {
    root.innerHTML = `<div class="loading"><h2>${t("no_results_title")}</h2><p>${t("no_lines_msg")}</p></div>`;
    return;
  }
  const cards = entries.map(e => {
    let cls = "", cbText = "";
    if (state.selectMode && e.count > 0) {
      const sel = selectedCounts[e.id] || 0;
      if (sel === e.count) cls = " selected";
      else if (sel > 0) { cls = " partial"; cbText = `${sel}/${e.count}`; }
    }
    return `
    <div class="line-card${cls}" data-line="${esc(e.id)}">
      <div class="sel-checkbox">${esc(cbText)}</div>
      <img loading="lazy" src="${esc(e.thumb)}" alt="${esc(e.name)}" onload="imgLoaded(this)" onerror="imgErr(this)">
      <div class="meta">
        <div class="name">${esc(e.name)}</div>
        <div class="count">${t("skins_count", e.count)}</div>
      </div>
    </div>`;
  }).join("");
  root.innerHTML = `
    <div class="champ-header is-list">
      <h2>${t("skin_lines_header")}</h2>
      <span class="count">${t("lines_count", entries.length)}</span>
    </div>
    <div class="line-grid">${cards}</div>`;
  root.querySelectorAll(".line-card").forEach(el => {
    el.addEventListener("click", () => openLine(el.dataset.line));
    const cb = el.querySelector(".sel-checkbox");
    if (cb) {
      cb.addEventListener("click", (ev) => {
        ev.stopPropagation();
        if (!state.selectMode) return;
        bulkToggleLine(el.dataset.line);
      });
    }
  });
}

function renderLine(root) {
  const lid = state.currentLine;
  const lname = lineName(lid);
  const idx = LINE_INDEX.get(String(lid));
  const items = idx ? idx.members.map(m => ({ champ: m.c, skin: m.s })) : [];
  if (items.length === 0) { state.view = "lines"; render(); return; }
  const cards = items.map((it, i) => {
    const k = SELECT_KEY(it.champ.alias, it.skin.label);
    const sel = state.selected.has(k) ? " selected" : "";
    const cn = champName(it.champ);
    const sl = skinLabel(it.champ, it.skin);
    return `
    <div class="skin-card${sel}" data-idx="${i}" data-key="${esc(k)}">
      <div class="sel-checkbox"></div>
      <img loading="lazy" src="${esc(it.skin.splash)}" alt="${esc(sl)}" onload="imgLoaded(this)" onerror="imgErr(this)">
      <div class="label">${esc(cn)} — ${esc(sl)}</div>
    </div>`;
  }).join("");
  root.innerHTML = `
    <div class="champ-header">
      <h2>${esc(lname)}</h2>
      <span class="count">${t("skins_count", items.length)}</span>
      <button class="btn primary" id="dl-line">${t("dl_line")}</button>
    </div>
    <div class="skin-grid">${cards}</div>`;
  const lbList = items.map(it => ({ champ: champName(it.champ), skin: skinLabel(it.champ, it.skin), src: it.skin.splash }));
  root.querySelectorAll(".skin-card").forEach(el => {
    el.addEventListener("click", () => {
      const idx = parseInt(el.dataset.idx, 10);
      if (state.selectMode) { toggleSelected(el.dataset.key, el); return; }
      openLightbox(lbList, idx, "manual");
    });
  });
  $("dl-line").addEventListener("click", () => downloadLine(lid, lname, items));
}

// 選択モード中、ヘッダー直下に「現在 N 件選択中 / DL / クリア」バーを出す
function renderPackBar() {
  const root = $("root");
  let bar = $("pack-bar");
  if (!state.selectMode || state.selected.size === 0) {
    if (bar) bar.remove();
    return;
  }
  const html = `
    <div class="pack-bar" id="pack-bar">
      <span class="count">${t("selected_count", state.selected.size)}</span>
      <span class="hint">${t("select_hint")}</span>
      <button class="btn" id="pack-clear">${t("clear")}</button>
      <button class="btn primary" id="pack-dl">${t("dl_selected")}</button>
    </div>`;
  if (bar) {
    bar.outerHTML = html;
  } else {
    root.insertAdjacentHTML("afterbegin", html);
  }
  $("pack-clear").addEventListener("click", clearSelected);
  $("pack-dl").addEventListener("click", downloadSelected);
}

function toggleSelected(key, el) {
  if (state.selected.has(key)) {
    state.selected.delete(key);
    if (el) el.classList.remove("selected");
  } else {
    state.selected.add(key);
    if (el) el.classList.add("selected");
  }
  saveSelected();
  renderPackBar();
}
// チャンプ/ライン単位の一括 toggle。state.selected は per-skin の Set なので、
// 「配下スキンの SELECT_KEY を一括 add/remove するだけ」。
// 「全部選択済み → 全解除」「それ以外 → 全選択」の indeterminate トグル。
// 部分選択 (3/14 等) の状態を保持したいときは、ユーザーは詳細画面に入って個別調整する
function bulkToggleKeys(keys) {
  if (!keys.length) return;
  const allSel = keys.every(k => state.selected.has(k));
  for (const k of keys) {
    if (allSel) state.selected.delete(k);
    else state.selected.add(k);
  }
  saveSelected();
  render();
}
function bulkToggleChamp(alias) {
  const c = DATA.champions.find(x => x.alias === alias);
  if (!c) return;
  bulkToggleKeys(c.skins.map(s => SELECT_KEY(c.alias, s.label)));
}
function bulkToggleLine(lid) {
  const idx = LINE_INDEX.get(String(lid));
  if (!idx) return;
  bulkToggleKeys(idx.members.map(m => SELECT_KEY(m.c.alias, m.s.label)));
}
function clearSelected() {
  state.selected.clear();
  saveSelected();
  render();
}

function openLine(lid) {
  state.view = "line"; state.currentLine = lid;
  window.scrollTo(0, 0); render();
}
function openLines() {
  state.view = "lines"; state.currentLine = null;
  state.searchQuery = ""; $("search").value = "";
  window.scrollTo(0, 0); render();
}

function buildChampList(c) {
  return c.skins.map(s => ({ champ: champName(c), skin: skinLabel(c, s), src: s.splash }));
}
// スライドショー対象: 選択中のスキンだけを返す (splash が無いものは除外)
function buildSelectedList() {
  const list = [];
  for (const k of state.selected) {
    const hit = SKIN_BY_KEY.get(k);
    if (hit && hit.s.splash) {
      list.push({ champ: champName(hit.c), skin: skinLabel(hit.c, hit.s), src: hit.s.splash });
    }
  }
  return list;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function openChampion(alias) {
  state.view = "champion"; state.currentChamp = alias;
  window.scrollTo(0, 0); render();
}
// 戻る: 検索中なら検索クリアを優先 (現在の view は維持)。
// それ以外は lines系→lines 一覧、その他→home。
function goBack() {
  if (state.searchQuery) {
    state.searchQuery = ""; $("search").value = "";
    render(); return;
  }
  if (state.view === "line") openLines();
  else { state.view = "home"; state.currentChamp = null; state.currentLine = null; render(); }
}
function goHome() {
  state.view = "home"; state.currentChamp = null; state.currentLine = null;
  state.searchQuery = ""; $("search").value = ""; render();
}

// === ZIP DL ===

function safeName(s) {
  return String(s).replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").replace(/[. ]+$/g, "").trim() || "_";
}
function extOf(url) {
  const m = /\.([a-zA-Z0-9]{2,4})(?:\?|$)/.exec(url);
  return m ? "." + m[1].toLowerCase() : ".jpg";
}
// "Aatrox//Justicar Aatrox" の key 配列から { champ, skin, url, path } リストを作る
function buildItemsFromSelected() {
  const items = [];
  for (const k of state.selected) {
    const hit = SKIN_BY_KEY.get(k);
    if (hit && hit.s.splash) items.push(itemFor(hit.c, hit.s));
  }
  return items;
}
function itemFor(c, s) {
  const skinName = s.label.endsWith("_Classic") ? "Classic" : s.label;
  return {
    champ: c.name,
    alias: c.alias,
    skin: skinName,
    url: s.splash,
    // ZIP内パスは平坦に <Champion>_<SkinName>.jpg。
    // Windows の壁紙スライドショー等は指定フォルダ直下しか走査しないため、
    // サブフォルダに分けると壁紙ローテーションで認識されない。
    // ファイル名衝突 (Classic.jpg が全チャンピオン分発生) はチャンピオン名で回避。
    path: `${safeName(c.name)}_${safeName(skinName)}${extOf(s.splash)}`,
  };
}

// 並列度制限付きの並列実行 (1度に concurrency 件まで)
async function pMap(items, fn, concurrency = 6) {
  const results = new Array(items.length);
  let cursor = 0;
  const workers = Array.from({ length: Math.min(concurrency, items.length) }, async () => {
    while (true) {
      const i = cursor++;
      if (i >= items.length) return;
      if (state.packAbort) return;
      results[i] = await fn(items[i], i);
    }
  });
  await Promise.all(workers);
  return results;
}

let progressLastUpdate = 0;
function showProgress(title, desc) {
  state.packAbort = false;
  $("prog-title").textContent = title;
  $("prog-desc").textContent = desc || t("zip_pack_desc_selected", "");
  $("prog-fill").style.width = "0%";
  $("prog-count").textContent = "0 / 0";
  $("prog-fail").textContent = "";
  $("prog-cancel").textContent = t("progress_cancel");
  const ov = $("progress-overlay");
  ov.classList.add("open");
  ov.setAttribute("aria-hidden", "false");
}
function updateProgress(done, total, failed) {
  // 描画コスト軽減のため、最後の更新から100ms以内ならスキップ (最終フレームは別途呼ぶ)
  const now = performance.now();
  if (done < total && now - progressLastUpdate < 100) return;
  progressLastUpdate = now;
  const pct = total ? Math.round((done / total) * 100) : 0;
  $("prog-fill").style.width = pct + "%";
  $("prog-count").textContent = `${done} / ${total}`;
  if (failed) $("prog-fail").textContent = t("zip_count_failed", failed);
}
function hideProgress() {
  const ov = $("progress-overlay");
  ov.classList.remove("open");
  ov.setAttribute("aria-hidden", "true");
}

// JSZip 読み込み完了まで待つ (defer で後読みのため init より遅れることがある)
function ensureJSZip() {
  return new Promise((resolve, reject) => {
    if (typeof JSZip !== "undefined") return resolve();
    const start = performance.now();
    // 外側で定義した i18n 関数 `t()` を遮らないよう、interval ID 用の変数は別名にする
    const iv = setInterval(() => {
      if (typeof JSZip !== "undefined") { clearInterval(iv); resolve(); }
      else if (performance.now() - start > 10000) {
        clearInterval(iv);
        reject(new Error(t("jszip_load_failed")));
      }
    }, 100);
  });
}

async function downloadAsZip(items, zipName, opts = {}) {
  if (!items.length) return;
  try {
    await ensureJSZip();
  } catch (e) {
    alert(e.message);
    return;
  }
  showProgress(t("zip_creating"), opts.desc || t("zip_pack_desc_selected", items.length));
  const zip = new JSZip();
  let done = 0, failed = 0;

  await pMap(items, async (it) => {
    if (state.packAbort) return;
    try {
      const res = await fetch(it.url, { mode: "cors", cache: "force-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      zip.file(it.path, blob);
    } catch (e) {
      failed++;
    }
    done++;
    updateProgress(done, items.length, failed);
  }, 6);

  if (state.packAbort) { hideProgress(); return; }
  updateProgress(items.length, items.length, failed);
  $("prog-title").textContent = t("zip_compressing");
  $("prog-desc").textContent = t("zip_bundling");
  // JPEG は元々圧縮済みなので STORE で時間短縮
  const blob = await zip.generateAsync(
    { type: "blob", compression: "STORE" },
    (meta) => {
      $("prog-fill").style.width = meta.percent.toFixed(1) + "%";
      $("prog-count").textContent = t("zip_bundling_pct", meta.percent.toFixed(0));
    },
  );
  saveBlob(blob, zipName);
  hideProgress();
  if (failed > 0) {
    setTimeout(() => alert(t("zip_failed", failed)), 100);
  }
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  // 大きい ZIP のダウンロード完了前に revoke すると壊れるので長めに遅延
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

// すべてのZIPに共通でプレフィックスを付けて、DLフォルダ内で識別しやすくする
const ZIP_PREFIX = "OpenLeagueDisplay";

function downloadChampion(c) {
  const items = c.skins.filter(s => s.splash).map(s => itemFor(c, s));
  // ZIP のファイル名/内部パスは英語固定 (locale 非依存にして、複数 locale で
  // 同じファイル名・配布物を作れるようにする / 古いツールの非ASCII問題回避)。
  // 進捗テキストだけは UI と整合させて翻訳名で出す
  downloadAsZip(items, `${ZIP_PREFIX}-${safeName(c.name)}.zip`, {
    desc: t("zip_pack_desc", champName(c), items.length),
  });
}
function downloadLine(lid, lineName, items) {
  const packItems = items.filter(it => it.skin.splash).map(it => itemFor(it.champ, it.skin));
  downloadAsZip(packItems, `${ZIP_PREFIX}-${safeName(lineName)}.zip`, {
    desc: t("zip_pack_desc", lineName, packItems.length),
  });
}
function downloadSelected() {
  const items = buildItemsFromSelected();
  if (!items.length) return;
  const stamp = new Date().toISOString().slice(0, 10);
  downloadAsZip(items, `${ZIP_PREFIX}-${stamp}.zip`, {
    desc: t("zip_pack_desc_selected", items.length),
  });
}

function openLightbox(list, idx, mode) {
  state.lb.list = list; state.lb.idx = idx; state.lb.mode = mode;
  state.lb.paused = false; state.lb.frontIsA = true;
  state.lb.lastFocus = document.activeElement;
  const lb = $("lightbox");
  lb.classList.add("open");
  lb.setAttribute("aria-hidden", "false");
  document.body.classList.add("lightbox-open");
  lb.classList.toggle("slideshow", mode === "slideshow");
  $("ss-controls").style.display = mode === "slideshow" ? "" : "none";
  // 間隔ボタンは上ツールバー側 (常時表示) に置いたので、スライドショー時のみ表示する
  $("ss-interval").style.display = mode === "slideshow" ? "" : "none";
  $("lb-mode").textContent = mode === "slideshow" ? t("mode_slideshow") : t("mode_viewer");
  // 初回画像はクロスフェード不要。直接 A に乗せて即表示
  const a = $("lb-img-a"), b = $("lb-img-b");
  const seq = ++state.lb.seq;
  a.onload = a.onerror = null;
  b.onload = b.onerror = null;
  b.classList.remove("show");
  a.classList.add("show");
  a.onerror = () => { if (seq === state.lb.seq && mode === "slideshow") scheduleNext(); };
  a.onload  = () => { if (seq === state.lb.seq && mode === "slideshow") scheduleNext(); };
  a.src = state.lb.list[idx].src;
  updateMeta();
  preloadAdjacent();
  // 閉じるボタンへフォーカス (キーボード操作の起点)
  $("lb-close").focus();
}

// 現在 idx の前後 1 枚を Image() で先読みしてブラウザキャッシュに乗せる。
// 次のスライド遷移時に fetch を待たずにフェードできる。リスト 1 枚のときは何もしない。
function preloadAdjacent() {
  const list = state.lb.list;
  const n = list.length;
  if (n < 2) return;
  const next = (state.lb.idx + 1) % n;
  const prev = (state.lb.idx - 1 + n) % n;
  const targets = next === prev ? [next] : [next, prev];
  // Image().src を立てるとブラウザのリソースキャッシュに乗る。GC されても
  // 同一 URL を再要求した時にキャッシュヒットするので参照保持は不要。
  for (const i of targets) new Image().src = list[i].src;
}
function closeLightbox() {
  const lb = $("lightbox");
  lb.classList.remove("open");
  lb.setAttribute("aria-hidden", "true");
  document.body.classList.remove("lightbox-open");
  stopSlideshow();
  // openLightbox の seq を進めて係争中の onload を無効化
  state.lb.seq++;
  if (state.lb.lastFocus && typeof state.lb.lastFocus.focus === "function") {
    state.lb.lastFocus.focus();
  }
}
function updateMeta() {
  const item = state.lb.list[state.lb.idx];
  if (!item) return;
  $("lb-champ").textContent = item.champ;
  $("lb-skin").textContent = item.skin;
  $("lb-counter").textContent = `${state.lb.idx + 1} / ${state.lb.list.length}`;
}
function showCurrent() {
  const item = state.lb.list[state.lb.idx];
  if (!item) return;
  const front = state.lb.frontIsA ? $("lb-img-a") : $("lb-img-b");
  const back  = state.lb.frontIsA ? $("lb-img-b") : $("lb-img-a");
  // 連打や低速回線で onload が遅延した場合、古いコールバックを無視するための識別子
  const seq = ++state.lb.seq;
  back.onload = null; back.onerror = null;
  back.onload = () => {
    if (seq !== state.lb.seq) return;
    back.classList.add("show");
    front.classList.remove("show");
    state.lb.frontIsA = !state.lb.frontIsA;
    if (state.lb.mode === "slideshow") scheduleNext();
  };
  back.onerror = () => {
    if (seq !== state.lb.seq) return;
    // 画像取得失敗時もスライドショーは止めず次へ
    if (state.lb.mode === "slideshow") scheduleNext();
  };
  back.src = item.src;
  updateMeta();
  preloadAdjacent();
}
function nextSlide() { state.lb.idx = (state.lb.idx + 1) % state.lb.list.length; showCurrent(); }
function prevSlide() { state.lb.idx = (state.lb.idx - 1 + state.lb.list.length) % state.lb.list.length; showCurrent(); }
// フェード完了/エラー後に呼ばれる。次の interval ぶん待ってから次のスライドへ
function scheduleNext() {
  stopSlideshow();
  if (state.lb.mode !== "slideshow" || state.lb.paused) return;
  state.lb.timer = setTimeout(nextSlide, state.lb.interval);
}
function startSlideshow() {
  stopSlideshow();
  // 初回画像のロード完了後に scheduleNext が呼ばれるので、ここで明示的に開始する必要なし。
  // ただし初回画像がキャッシュ済みで onload 発火タイミングが微妙な場合に備え、
  // フォールバックで interval 後に1回開始する
  state.lb.timer = setTimeout(nextSlide, state.lb.interval);
}
function stopSlideshow() {
  if (state.lb.timer) { clearTimeout(state.lb.timer); state.lb.timer = null; }
}
function startGlobalSlideshow() {
  if (!DATA) return;
  const list = buildSelectedList();
  if (list.length === 0) {
    alert(t("slideshow_empty"));
    return;
  }
  openLightbox(shuffle(list), 0, "slideshow");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

// 画像のロード完了/失敗で親カードに img-loaded を付け、シマー (CSS の ::before) を止める
window.imgLoaded = function(img) {
  img.onload = null;
  const card = img.parentElement;
  if (card) card.classList.add("img-loaded");
};
// サムネ画像が CDN で 404 になった時、空のカードに見えないよう薄く塗りつぶす。
// 失敗時もシマーを止めないと「ずっと読込中」に見えてしまうため img-loaded を付ける
window.imgErr = function(img) {
  img.onerror = null;
  img.style.opacity = "0.15";
  img.removeAttribute("src");
  const card = img.parentElement;
  if (card) card.classList.add("img-loaded");
};

document.addEventListener("DOMContentLoaded", () => {
  init();
  $("title").addEventListener("click", goHome);
  $("back-btn").addEventListener("click", goBack);
  $("tab-home").addEventListener("click", goHome);
  $("nav-lines").addEventListener("click", openLines);
  $("slideshow-btn").addEventListener("click", startGlobalSlideshow);
  $("select-toggle").addEventListener("click", () => {
    state.selectMode = !state.selectMode;
    document.body.classList.toggle("select-mode", state.selectMode);
    $("select-toggle").classList.toggle("primary", state.selectMode);
    $("select-toggle").textContent = state.selectMode ? t("select_mode_on") : t("select_mode");
    render();
  });
  $("lang-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    const menu = $("lang-menu");
    const open = !menu.hidden;
    menu.hidden = open;
    $("lang-btn").setAttribute("aria-expanded", open ? "false" : "true");
  });
  $("lang-menu").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-code]");
    if (!btn) return;
    const code = btn.dataset.code;
    closeLangMenu();
    lsSet(LS_LOCALE_KEY, code);
    // ロード中はボタンを無効化して連打を防ぐ。ファイルは static で軽いので
    // 進捗 UI 等は出さず、blocking なロードで十分 (default→non-default で 100KB 程度)
    $("lang-btn").disabled = true;
    await loadLocale(code);
    $("lang-btn").disabled = false;
    // ロード失敗時 loadLocale が default に戻すので、UI もそれに合わせる
    setLangButton(state.locale);
    // UI chrome (ボタン/プレースホルダ/aria) も locale 切替に追従させる
    applyStaticUIStrings();
    render();
  });
  // メニュー外クリック / Escape で閉じる
  document.addEventListener("click", (e) => {
    if (!$("lang-picker").contains(e.target)) closeLangMenu();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("lang-menu").hidden) {
      closeLangMenu();
      $("lang-btn").focus();
    }
  });
  $("prog-cancel").addEventListener("click", () => {
    state.packAbort = true;
    hideProgress();
  });
  // 入力中に毎キーストロークで render() を回すと、Lines タブ (~2000 スキン分の
  // 選択集計を含む) で体感がもたつくので 90ms debounce
  let searchTimer = null;
  $("search").addEventListener("input", (e) => {
    const value = e.target.value.trim();
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.searchQuery = value;
      // home/lines のフィルタとして動く。詳細画面で検索したら一覧に戻す
      if (state.view === "champion") state.view = "home";
      if (state.view === "line") state.view = "lines";
      render();
    }, 90);
  });
  $("sort-select").addEventListener("change", (e) => {
    state.sortOrder = e.target.value;
    lsSet(LS_SORT_KEY, state.sortOrder);
    render();
  });
  $("lb-close").addEventListener("click", closeLightbox);
  $("lb-prev").addEventListener("click", prevSlide);
  $("lb-next").addEventListener("click", nextSlide);
  $("ss-pause").addEventListener("click", () => {
    state.lb.paused = !state.lb.paused;
    $("ss-pause").textContent = state.lb.paused ? t("ss_resume") : t("ss_pause");
    // setTimeout 連鎖モデルなので、再開時にタイマーを再点火する必要がある
    if (state.lb.paused) stopSlideshow();
    else if (state.lb.mode === "slideshow") scheduleNext();
  });
  $("ss-interval").addEventListener("click", () => {
    const seqs = [3000, 5000, 7000, 10000, 15000, 30000];
    const i = seqs.indexOf(state.lb.interval);
    state.lb.interval = seqs[(i + 1) % seqs.length];
    $("ss-interval").textContent = t("ss_interval", state.lb.interval / 1000);
    if (state.lb.mode === "slideshow") startSlideshow();
  });
  // タッチスワイプ (モバイル): 横方向の動きが縦より明確に大きい時だけ反応させる
  let tStartX = 0, tStartY = 0;
  const lbEl = $("lightbox");
  lbEl.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    tStartX = e.touches[0].clientX;
    tStartY = e.touches[0].clientY;
  }, { passive: true });
  lbEl.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - tStartX;
    const dy = t.clientY - tStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx > 0) prevSlide(); else nextSlide();
    }
  }, { passive: true });

  document.addEventListener("keydown", (e) => {
    // 進捗オーバーレイ表示中はEsc=中止のみ受け付ける
    if ($("progress-overlay").classList.contains("open")) {
      if (e.key === "Escape") { state.packAbort = true; hideProgress(); }
      return;
    }
    if (!$("lightbox").classList.contains("open")) {
      if (e.key === "Escape" && state.view !== "home") goBack();
      return;
    }
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowRight") nextSlide();
    else if (e.key === "ArrowLeft") prevSlide();
    else if (e.key === " ") { e.preventDefault(); if (state.lb.mode === "slideshow") $("ss-pause").click(); }
  });
});
</script>
