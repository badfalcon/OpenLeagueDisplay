<!DOCTYPE html>
<!-- i18n-loading: ES Modules は defer 相当で、保存 locale の applyStaticUIStrings()
     が走る前に index.html の英語ハードコードが一瞬見えてしまう。styles.css 側で
     対象要素を visibility:hidden にしておき、init() 内で外す。
     JS が完全に失敗した時のための保険として 3 秒経過で自動解除する -->
<html lang="en" class="i18n-loading">
<head>
<script>setTimeout(function(){document.documentElement.classList.remove("i18n-loading");},3000);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--
  Content Security Policy (defense-in-depth)
  ------------------------------------------
  全 innerHTML 補間は esc() で HTML エスケープ済みなので XSS シンクは無いが、
  将来の回帰防止と CDN 侵害時の影響軽減のためのバックストップ。
  - script-src: 'self' で js/*.js (ES Modules) をカバー。'unsafe-inline' は
    onload="imgLoaded(this)" 等のインラインイベント属性のために残す
    (event delegation 化までの暫定)。jsdelivr は JSZip の CDN ロード用、
    static.cloudflareinsights.com は Cloudflare Web Analytics の beacon.min.js 用
  - style-src: 'self' で styles.css をカバー。Google Fonts と一部 innerHTML 内の
    style="min-width:Nch" のような inline style 属性のため 'unsafe-inline'
  - img-src: data: は styles.css の inline SVG アイコン (検索虫眼鏡 / セレクト矢印 /
    body::after ノイズ) を表示するために必要。blob: は生成していないので付けない。
    CDragon + 国旗 CDN を外部画像として許可
  - connect-src: ZIP化で raw.communitydragon.org に fetch、i18n/data.json は self、
    cloudflareinsights.com は Web Analytics の計測 beacon 送信先
  - manifest-src: PWA の manifest.webmanifest は同一オリジン
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://raw.communitydragon.org https://flagcdn.com; connect-src 'self' https://raw.communitydragon.org https://cloudflareinsights.com; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<meta name="description" content="OpenLeagueDisplay — A splash viewer for every League of Legends champion and skin. Pick favorites, download as ZIP, set as wallpaper.">
<!-- OGP / Twitter Card: og:image / twitter:image はクローラが相対URLを解決
     できないので絶対URLで指す。ogp.png は 1200x630 (twitter:card は
     summary_large_image の推奨比 1.91:1)、リポジトリ直下の静的アセット。
     差し替え時は og:image:width/height も合わせること -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://badfalcon.github.io/OpenLeagueDisplay/">
<meta property="og:title" content="OpenLeagueDisplay">
<meta property="og:description" content="Static splash viewer aiming to replace LeagueDisplays. Download by champion / skin line / selection as ZIP.">
<meta property="og:image" content="https://badfalcon.github.io/OpenLeagueDisplay/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="OpenLeagueDisplay — splash viewer for every League of Legends champion and skin">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OpenLeagueDisplay">
<meta name="twitter:description" content="Static splash viewer aiming to replace LeagueDisplays">
<meta name="twitter:image" content="https://badfalcon.github.io/OpenLeagueDisplay/ogp.png">
<title>OpenLeagueDisplay</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- PWA: ホーム画面追加 / インストール用。アイコンは SVG (リポジトリにバイナリを
     置かない方針を維持)。theme-color はサイトの --bg に揃える。
     apple-* メタは iOS の standalone 表示と非透過ステータスバー指定用 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07060b">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenLeague">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.communitydragon.org">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- JSZip: ブラウザ完結でZIPを作るために遅延読込。CDN障害時もビューア自体は動く。
     integrity (SRI) で jsdelivr 侵害時の任意JS実行を防ぐ。バージョンを上げる時は
     https://www.srihash.org/ などでハッシュも再生成すること -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
        integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
        crossorigin="anonymous" defer></script>
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<!-- topbar: 2 段構成の sticky バー。
     行1 (.header-primary):   brand (ロゴ + 件数) … ? + 言語ピッカー (.header-utils)
     行2 (.header-secondary): view-tabs … My Gallery / Slideshow (.header-actions)
     行1 に識別情報 + 常設ユーティリティ、行2 に閲覧操作、と役割で段を分ける。
     検索バー / 戻るボタン / ソートは下の dom-stash に置き、render() で
     .champ-header-controls スロットへ transplant する -->
<div class="topbar">
  <header>
    <div class="header-primary">
      <div class="header-brand">
        <div class="header-brand-info">
          <h1 id="title">OpenLeagueDisplay</h1>
          <span id="stats"></span>
        </div>
      </div>
      <div class="header-utils">
        <button class="btn btn-icon" id="help-btn" type="button" aria-label="Open guide">?</button>
        <!-- 共有: Web Share API 対応端末 (主にモバイル) はネイティブ共有シート、
             非対応端末はサイト URL をクリップボードへコピーする。アイコンは
             外部アセットを増やさないため inline SVG (リポジトリにバイナリを置かない方針) -->
        <button class="btn btn-icon" id="share-btn" type="button" aria-label="Share this site">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line>
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
          </svg>
        </button>
        <div class="lang-picker" id="lang-picker">
          <button class="btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Display language">
            <img class="lang-flag" id="lang-flag" alt="" decoding="async">
          </button>
          <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
        </div>
      </div>
    </div>
    <div class="header-secondary">
      <div class="view-tabs" role="tablist">
        <button class="tab" id="tab-home" role="tab" type="button">Champions</button>
        <button class="tab" id="nav-lines" role="tab" type="button">Skin Lines</button>
      </div>
      <div class="header-actions">
        <button class="btn" id="select-toggle" aria-label="My Gallery">My Gallery</button>
        <button class="btn" id="slideshow-btn">Slideshow</button>
      </div>
    </div>
  </header>
</div>

<!-- DOM 保管庫: 検索バー / 戻るボタン / 並び順セレクタの「住所」。render() の
     直前にここへ退避させ、innerHTML 再生成後の .champ-header-controls スロットに
     transplant する。hidden 属性で非表示 -->
<div class="dom-stash" id="dom-stash" hidden>
  <button class="btn" id="back-btn">← Back</button>
  <input type="search" id="search" placeholder="Search champion…">
  <select class="ctrl-select" id="sort-select" aria-label="Sort order">
    <option value="default">Default</option>
    <option value="name_asc">Name A → Z</option>
    <option value="name_desc">Name Z → A</option>
  </select>
</div>

<main id="root">
  <div class="loading"><h2 id="loading-title">LOADING</h2><p id="loading-msg">Loading manifest…</p></div>
</main>

<div class="progress-overlay" id="progress-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="progress-box">
    <h3 id="prog-title">Creating ZIP</h3>
    <div class="desc" id="prog-desc">Fetching images from CDragon…</div>
    <div class="progress-bar"><div class="fill" id="prog-fill" style="width:0%"></div></div>
    <div class="progress-stats">
      <span id="prog-count">0 / 0</span>
      <span id="prog-fail"></span>
    </div>
    <div class="progress-actions">
      <button class="btn" id="prog-cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Splash zoom view" aria-hidden="true">
  <div class="lb-stage">
    <img class="lb-img" id="lb-img-a" alt="">
    <img class="lb-img" id="lb-img-b" alt="">
  </div>
  <div class="lb-toolbar">
    <span class="badge" id="lb-counter"></span>
    <span class="badge" id="lb-mode"></span>
    <!-- 間隔は「一度決めたら固定」の設定なので、操作 (一時停止) とは分離して
         常時表示の上ツールバーに置く。スライドショー時のみ JS で表示する -->
    <button class="ss-btn" id="ss-interval" style="display:none">⏱ 7s</button>
  </div>
  <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <button class="lb-nav lb-next" id="lb-next" aria-label="Next">›</button>
  <div class="lb-overlay">
    <div class="lb-champ" id="lb-champ"></div>
    <div class="lb-skin" id="lb-skin"></div>
    <!-- スキンの説明文 (lore/flavor)。description を持つスキンは少数なので、
         無いときは js 側で hidden 属性を立てて畳む -->
    <div class="lb-desc" id="lb-desc" hidden></div>
  </div>
  <div class="slideshow-controls" id="ss-controls">
    <button class="ss-btn" id="ss-pause">⏸ Pause</button>
  </div>
</div>

<!-- tutorial overlay: 初回訪問時に自動表示 / ヘッダ ? ボタンと ? キーから再表示。
     本文は tutorial.js が i18n テーブルから innerHTML で流す (信頼済み文字列のみ) -->
<div class="tutorial-overlay" id="tutorial-overlay" role="dialog" aria-modal="true" aria-labelledby="tut-title" aria-hidden="true">
  <div class="tutorial-box">
    <div class="tut-step-counter" id="tut-step-counter"></div>
    <h2 class="tut-title" id="tut-title"></h2>
    <div class="tut-body" id="tut-body"></div>
    <div class="tut-dots" id="tut-dots" aria-hidden="true"></div>
    <div class="tut-actions">
      <button class="btn" id="tut-skip" type="button">Skip</button>
      <div class="tut-nav">
        <button class="btn" id="tut-back" type="button">Back</button>
        <button class="btn primary" id="tut-next" type="button">Next</button>
      </div>
    </div>
  </div>
</div>

<!-- オフライン検知バナー: navigator.onLine と online/offline イベントで開閉。
     CDragon のスプラッシュ画像はキャッシュ対象外なので、オフラインでは画像が
     出ない。「壊れている」ように見えないよう理由を明示する。
     文言は applyStaticUIStrings() が i18n テーブルから流す -->
<div class="offline-banner" id="offline-banner" role="status" aria-live="polite" hidden>
  <span id="offline-banner-text">You are offline — splash images may not load.</span>
</div>

<!-- スクリーンリーダー向けの状態通知。視覚ユーザーには共有ボタンのアイコンが
     チェックマークへ変わるが、aria-label の書き換えだけでは読み上げられないため、
     コピー完了をこの live region のテキスト更新で通知する -->
<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>

<footer>
  <div class="footer-inner">
    <div class="footer-attribution">
      Images & data from <a href="https://communitydragon.org" target="_blank" rel="noopener">Community Dragon</a>
      · League of Legends © Riot Games, Inc.
      · <span id="patch-info"></span>
    </div>
    <div class="footer-credits">
      by <a href="https://github.com/badfalcon" target="_blank" rel="noopener">@badfalcon</a>
      · <a href="https://github.com/badfalcon/OpenLeagueDisplay" target="_blank" rel="noopener">Source</a>
      · <a href="https://github.com/badfalcon/OpenLeagueDisplay/blob/HEAD/LICENSE" target="_blank" rel="noopener">MIT License</a>
    </div>
    <!-- 法的免責: Riot の "Legal Jibber Jabber" ポリシーは Riot 非公認である旨の
         明記を求めている。文言は applyStaticUIStrings() が i18n テーブルから流す -->
    <p class="footer-disclaimer" id="footer-disclaimer"></p>
  </div>
</footer>

<!-- Cloudflare Web Analytics: Cookie レス / プライバシー配慮の軽量アクセス解析。
     beacon.min.js を defer で 1 本読むだけ。機能ライブラリ (JSZip) とは別枠の
     解析専用の外部依存で、CDN 障害時もビューア自体は動く。
     計測 beacon は cloudflareinsights.com へ送られる (CSP の connect-src で許可)。
     sw.js は同一オリジンのみインターセプトするのでこのリクエストは素通し。
     data-cf-beacon の token は Cloudflare ダッシュボードのサイト登録で発行された値。 -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "3b9c447cd38d42a48d7bc318ffedd059"}'></script>

</body>
</html>
