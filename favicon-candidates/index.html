<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>favicon candidates</title>
<style>
  :root { --bg:#07060b; --bg-1:#0c0b14; --gold:#d4a857; --fg:#e7e3d8; }
  body {
    margin: 0; padding: 40px;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif;
  }
  h1 { color: var(--gold); font-weight: 400; letter-spacing: .1em; }
  .row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px; margin-top: 24px;
  }
  .card {
    background: var(--bg-1);
    border: 1px solid #2a2638;
    border-radius: 8px; padding: 16px;
  }
  .card h2 {
    font-size: 14px; margin: 0 0 12px;
    color: var(--gold); letter-spacing: .05em;
  }
  /* 各サイズで確認 (16/32/64/128) */
  .sizes {
    display: flex; align-items: end; gap: 16px;
    background: #15131c; padding: 12px; border-radius: 4px;
  }
  .sizes img { display: block; image-rendering: auto; }
  .sizes div { text-align: center; font-size: 11px; opacity: .6; }
  /* 白背景でも一応 (タブ色によっては明るい背景になるブラウザもあるので) */
  .light { background: #f0eee5; }
</style>
</head>
<body>
<h1>favicon candidates</h1>
<p>各案を 16 / 32 / 64 / 128 px で並べたもの。タブの favicon は実質 16px なので、16 列で潰れていないか見るのが本番。</p>
<div class="row">
  <div class="card">
    <h2>A. ギャラリーグリッド</h2>
    <div class="sizes">
      <div><img src="a-grid.svg" width="16" height="16"><br>16</div>
      <div><img src="a-grid.svg" width="32" height="32"><br>32</div>
      <div><img src="a-grid.svg" width="64" height="64"><br>64</div>
      <div><img src="a-grid.svg" width="128" height="128"><br>128</div>
    </div>
  </div>
  <div class="card">
    <h2>B. ヘックス + L</h2>
    <div class="sizes">
      <div><img src="b-hex-l.svg" width="16" height="16"><br>16</div>
      <div><img src="b-hex-l.svg" width="32" height="32"><br>32</div>
      <div><img src="b-hex-l.svg" width="64" height="64"><br>64</div>
      <div><img src="b-hex-l.svg" width="128" height="128"><br>128</div>
    </div>
  </div>
  <div class="card">
    <h2>C. クリスタル</h2>
    <div class="sizes">
      <div><img src="c-crystal.svg" width="16" height="16"><br>16</div>
      <div><img src="c-crystal.svg" width="32" height="32"><br>32</div>
      <div><img src="c-crystal.svg" width="64" height="64"><br>64</div>
      <div><img src="c-crystal.svg" width="128" height="128"><br>128</div>
    </div>
  </div>
  <div class="card">
    <h2>D. フレーム + L</h2>
    <div class="sizes">
      <div><img src="d-frame-l.svg" width="16" height="16"><br>16</div>
      <div><img src="d-frame-l.svg" width="32" height="32"><br>32</div>
      <div><img src="d-frame-l.svg" width="64" height="64"><br>64</div>
      <div><img src="d-frame-l.svg" width="128" height="128"><br>128</div>
    </div>
  </div>
  <div class="card">
    <h2>E. ヘックス + グリッド</h2>
    <div class="sizes">
      <div><img src="e-hex-grid.svg" width="16" height="16"><br>16</div>
      <div><img src="e-hex-grid.svg" width="32" height="32"><br>32</div>
      <div><img src="e-hex-grid.svg" width="64" height="64"><br>64</div>
      <div><img src="e-hex-grid.svg" width="128" height="128"><br>128</div>
    </div>
  </div>
  <div class="card">
    <h2>F. L モノグラム</h2>
    <div class="sizes">
      <div><img src="f-mono-l.svg" width="16" height="16"><br>16</div>
      <div><img src="f-mono-l.svg" width="32" height="32"><br>32</div>
      <div><img src="f-mono-l.svg" width="64" height="64"><br>64</div>
      <div><img src="f-mono-l.svg" width="128" height="128"><br>128</div>
    </div>
  </div>
</div>
</body>
</html>
