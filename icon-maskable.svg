<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- For maskable: shrink favicon.svg's L to ~60% centered so it stays inside the
       safe zone, with a full-bleed background and no rounded corners (the OS clips it to a circle/rounded shape) -->
  <rect width="64" height="64" fill="#07060b"/>
  <g transform="translate(32,32) scale(0.62) translate(-31,-35)">
    <path d="M20 12 L20 52 L48 52"
          fill="none" stroke="#d4a857" stroke-width="7"
          stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="14" y1="12" x2="26" y2="12" stroke="#d4a857" stroke-width="3"/>
    <line x1="48" y1="46" x2="48" y2="58" stroke="#d4a857" stroke-width="3"/>
  </g>
</svg>
